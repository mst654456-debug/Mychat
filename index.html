<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الشات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #e7e4da;
      --surface: #f8f7f3;
      --ink: #1d2331;
      --muted: #6b7180;
      --brick: #b8462e;
      --line: #cfcabb;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      font-size: 16px;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }

    .app {
      width: 100%;
      max-width: 460px;
      height: 100%;
      max-height: 760px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      border-inline: 1px solid var(--line);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 2px solid var(--ink);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .head-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      color: var(--muted);
    }
    #me { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ghost {
      background: none;
      border: 1px solid var(--ink);
      color: var(--ink);
      border-radius: 4px;
      padding: 4px 12px;
    }

    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #login { justify-content: center; gap: 14px; padding: 32px 22px; }
    #login h2 { margin: 0; font-size: 24px; font-weight: 600; }
    .hint { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .primary {
      padding: 12px;
      background: var(--ink);
      color: var(--surface);
      border: none;
      border-radius: 4px;
    }
    .error { min-height: 22px; color: var(--brick); font-size: 14px; }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 78%;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      align-self: flex-end;
      overflow-wrap: anywhere;
    }
    .msg.me {
      align-self: flex-start;
      background: var(--ink);
      border-color: var(--ink);
      color: var(--surface);
    }
    .msg .who { font-size: 13px; font-weight: 600; color: var(--brick); }
    .msg.me .who { display: none; }
    .msg .time { margin-top: 4px; font-size: 11px; color: var(--muted); }
    .msg.me .time { color: #a9afbd; }

    form#form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 2px solid var(--ink);
    }
    form#form input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
    }
    form#form button {
      padding: 0 18px;
      background: var(--brick);
      color: #fff;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>الشات</h1>
      <div class="head-right">
        <span id="me"></span>
        <button id="logoutBtn" class="ghost" hidden>خروج</button>
      </div>
    </header>

    <section id="login" class="screen">
      <h2>ادخل بحساب Gmail</h2>
      <p class="hint">أي حد عنده حساب Google يقدر يدخل ويكتب في الشات.</p>
      <button class="primary" id="loginBtn">الدخول بـ Google</button>
      <div class="error" id="error"></div>
    </section>

    <section id="chat" class="screen" hidden>
      <div id="messages"></div>
      <form id="form">
        <input id="text" placeholder="اكتب رسالة" autocomplete="off" maxlength="500" />
        <button type="submit">إرسال</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // حط هنا بيانات مشروعك من Firebase (Project settings > Your apps)
    const firebaseConfig = {
      apiKey: 'AIzaSyBeb4EKVwVuxyBF--V11ehJXrYwm55Ca4Y',
      authDomain: 'mychat-2f14b.firebaseapp.com',
      projectId: 'mychat-2f14b',
      storageBucket: 'mychat-2f14b.firebasestorage.app',
      messagingSenderId: '122687623931',
      appId: '1:122687623931:web:f8fbfa0074701e6388965e',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    const $ = (id) => document.getElementById(id);
    let currentUser = null;
    let unsubscribe = null;

    $('loginBtn').onclick = async () => {
      $('error').textContent = '';
      if (firebaseConfig.apiKey.startsWith('PASTE_')) {
        $('error').textContent = 'لازم تحط بيانات Firebase في الملف الأول';
        return;
      }
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        if (err.code === 'auth/unauthorized-domain') {
          $('error').textContent =
            'الدومين ده مش متضاف في Firebase > Authentication > Settings > Authorized domains';
        } else if (err.code !== 'auth/popup-closed-by-user') {
          $('error').textContent = 'حصلت مشكلة في الدخول: ' + err.code;
        }
      }
    };

    $('logoutBtn').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (user) {
        $('login').hidden = true;
        $('chat').hidden = false;
        $('logoutBtn').hidden = false;
        $('me').textContent = user.displayName || user.email;

        const q = query(
          collection(db, 'messages'),
          orderBy('createdAt', 'desc'),
          limit(100)
        );
        unsubscribe = onSnapshot(q, render, (err) => {
          alert('مش قادر أحمّل الرسايل: ' + err.message);
        });
      } else {
        if (unsubscribe) unsubscribe();
        unsubscribe = null;
        $('login').hidden = false;
        $('chat').hidden = true;
        $('logoutBtn').hidden = true;
        $('me').textContent = '';
        $('messages').innerHTML = '';
      }
    });

    function render(snap) {
      const box = $('messages');
      box.innerHTML = '';

      // الرسايل جت من الأحدث للأقدم، فبنعكس الترتيب
      for (const d of snap.docs.slice().reverse()) {
        const m = d.data();
        const el = document.createElement('div');
        el.className = 'msg' + (currentUser && m.uid === currentUser.uid ? ' me' : '');

        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = m.name;

        const text = document.createElement('div');
        text.textContent = m.text;

        const time = document.createElement('div');
        time.className = 'time';
        const date = m.createdAt ? m.createdAt.toDate() : new Date();
        time.textContent = date.toLocaleTimeString('ar-EG', {
          hour: '2-digit',
          minute: '2-digit',
        });

        el.append(who, text, time);
        box.appendChild(el);
      }
      box.scrollTop = box.scrollHeight;
    }

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = $('text');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = '';
      try {
        await addDoc(collection(db, 'messages'), {
          text: text.slice(0, 500),
          uid: currentUser.uid,
          name: currentUser.displayName || currentUser.email,
          createdAt: serverTimestamp(),
        });
      } catch (err) {
        input.value = text;
        alert('الرسالة متبعتتش: ' + err.message);
      }
    };
  </script>
</body>
</html>
