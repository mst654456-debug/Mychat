<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1416">
<title>شاتي الخاص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1416;--panel:#152024;--line:#223238;--text:#e8efec;--muted:#7f9a9c;--gold:#d9a441;--bubble:#1d2d33}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px}
button,input{font:inherit;color:inherit}
.screen{height:100vh;height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column}
.bar,.chat-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.bar h1{flex:1;margin:0;font-size:18px;font-weight:700}
.muted{color:var(--muted);font-size:14px}
.center{text-align:center}
.btn{background:var(--gold);color:#17120a;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
input{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err{min-height:22px;margin:4px 0 0;color:#ff8a7a;font-size:14px}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.section-title{margin:0;padding:14px 16px 8px;color:var(--muted);font-size:14px}
.composer{display:flex;gap:8px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line)}
.list{flex:1;overflow:auto}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;cursor:pointer}
.item:hover{background:var(--panel)}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bubble);color:var(--gold);font-weight:700}
.info{flex:1;min-width:0}
.name{font-weight:600}
.last{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--muted);font-size:14px}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.chat-head .name{flex:1}
.messages{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:16px}
.bubble{max-width:78%;padding:9px 14px;border-radius:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.mine{align-self:flex-start;background:var(--gold);color:#17120a;border-top-right-radius:4px}
.theirs{align-self:flex-end;background:var(--bubble);border-top-left-radius:4px}
.auth{justify-content:center;padding:24px}
.auth-box{width:100%;max-width:360px;margin:0 auto}
.brand{margin:0 0 6px;text-align:center;font-size:28px;font-weight:700}
.tabs{display:flex;gap:8px;margin:22px 0 14px}
.tabs .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>

<section id="auth" class="screen auth">
  <div class="auth-box">
    <h1 class="brand">شاتي الخاص</h1>
    <p class="muted center">الدخول باسم المستخدم وكلمة المرور</p>
    <div class="tabs">
      <button class="btn" data-mode="login" type="button">دخول</button>
      <button class="btn ghost" data-mode="signup" type="button">حساب جديد</button>
    </div>
    <form id="authForm" class="stack">
      <input id="username" dir="ltr" placeholder="اسم المستخدم (إنجليزي، 3 إلى 20 حرفًا)" autocomplete="username" required>
      <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="current-password" minlength="6" required>
      <button id="authBtn" class="btn" type="submit">دخول</button>
      <p id="authErr" class="err"></p>
    </form>
  </div>
</section>

<section id="app" class="screen" hidden>
  <header class="bar">
    <button id="back" class="btn ghost" type="button" hidden>رجوع</button>
    <h1>شاتي الخاص</h1>
    <span id="me" class="muted"></span>
    <button id="logout" class="btn ghost" type="button">خروج</button>
  </header>

  <div id="listView" class="view" hidden>
    <h2 class="section-title">الغرف</h2>
    <div id="roomList" class="list"></div>
  </div>

  <div id="chatView" class="view" hidden>
    <div class="chat-head">
      <span id="chatTitle" class="name"></span>
    </div>
    <div id="messages" class="messages"></div>
    <form id="sendForm" class="composer">
      <input id="msgInput" placeholder="اكتب رسالة" autocomplete="off">
      <button class="btn" type="submit">إرسال</button>
    </form>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, collection, query,
  orderBy, limit, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ضع هنا إعدادات تطبيق الويب من Firebase */
const firebaseConfig = {
  apiKey: "PUT_API_KEY",
  authDomain: "PUT_AUTH_DOMAIN",
  projectId: "PUT_PROJECT_ID",
  storageBucket: "PUT_STORAGE_BUCKET",
  messagingSenderId: "PUT_SENDER_ID",
  appId: "PUT_APP_ID",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* نطاق داخلي وهمي: المستخدم يدخل باسم المستخدم فقط ولا يرى هذا النطاق */
const DOMAIN = "shat.app";

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};

const ERRORS = {
  "auth/invalid-credential": "اسم المستخدم أو كلمة المرور غير صحيحة",
  "auth/email-already-in-use": "اسم المستخدم مأخوذ، جرّب اسمًا آخر",
  "auth/weak-password": "كلمة المرور قصيرة، استخدم 6 أحرف على الأقل",
  "auth/network-request-failed": "تحقق من اتصال الإنترنت",
  "auth/operation-not-allowed": "فعّل Email/Password في Firebase Authentication",
  "auth/configuration-not-found": "فعّل Email/Password في Firebase Authentication",
  "auth/unauthorized-domain": "أضف نطاق GitHub Pages إلى Authorized domains في Firebase",
  "permission-denied": "لا توجد صلاحية. تأكد من نشر قواعد Firestore وإنشاء settings/owner",
};
const errText = e => ERRORS[e.code] || e.message || "حدث خطأ غير متوقع";

let me = null;            // { uid, username, isOwner }
let roomId = null;        // معرّف الغرفة المفتوحة = uid صاحب الغرفة
let mode = "login";
let unsubRooms = null, unsubMsgs = null;

/* تبديل بين الدخول وإنشاء الحساب */
document.querySelectorAll("[data-mode]").forEach(btn => btn.onclick = () => {
  mode = btn.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach(b => b.className = b === btn ? "btn" : "btn ghost");
  $("authBtn").textContent = mode === "login" ? "دخول" : "إنشاء الحساب";
  $("authErr").textContent = "";
});

$("authForm").onsubmit = async e => {
  e.preventDefault();
  const username = $("username").value.trim().toLowerCase();
  const password = $("password").value;
  $("authErr").textContent = "";
  if (!/^[a-z0-9_]{3,20}$/.test(username)) {
    $("authErr").textContent = "اسم المستخدم: من 3 إلى 20 حرفًا إنجليزيًا أو أرقام أو _";
    return;
  }
  $("authBtn").disabled = true;
  try {
    const email = `${username}@${DOMAIN}`;
    if (mode === "login") await signInWithEmailAndPassword(auth, email, password);
    else await createUserWithEmailAndPassword(auth, email, password);
  } catch (err) {
    $("authErr").textContent = errText(err);
  } finally {
    $("authBtn").disabled = false;
  }
};

$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  stopAll();
  if (!user) {
    me = null;
    roomId = null;
    $("app").hidden = true;
    $("auth").hidden = false;
    $("listView").hidden = true;
    $("chatView").hidden = true;
    $("roomList").textContent = "";
    $("messages").textContent = "";
    return;
  }
  try {
    const username = user.email.split("@")[0];
    const ownerSnap = await getDoc(doc(db, "settings", "owner"));
    const isOwner = ownerSnap.exists() && ownerSnap.data().uid === user.uid;
    me = { uid: user.uid, username, isOwner };

    $("me").textContent = isOwner ? `الصاحب: ${username}` : username;
    $("auth").hidden = true;
    $("app").hidden = false;

    if (isOwner) {
      $("listView").hidden = false;
      listenRooms();
    } else {
      // غرفة خاصة بهذا المستخدم مع الصاحب، تُنشأ أو تُحدَّث عند الدخول
      await setDoc(doc(db, "rooms", user.uid), { userUid: user.uid, username }, { merge: true });
      openRoom(user.uid, "صاحب الشات");
    }
  } catch (err) {
    $("authErr").textContent = errText(err);
  }
});

function stopAll() {
  unsubRooms?.();
  unsubMsgs?.();
  unsubRooms = null;
  unsubMsgs = null;
}

/* الصاحب فقط: قائمة كل الغرف مرتبة حسب آخر رسالة */
function listenRooms() {
  unsubRooms?.();
  unsubRooms = onSnapshot(collection(db, "rooms"),
    snap => {
      const items = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(r => r.id !== me.uid)
        .sort((a, b) => (b.lastAt?.toMillis?.() ?? 0) - (a.lastAt?.toMillis?.() ?? 0));
      renderRooms(items);
    },
    err => { $("roomList").replaceChildren(el("p", "empty", errText(err))); }
  );
}

function renderRooms(items) {
  const list = $("roomList");
  list.textContent = "";
  if (!items.length) {
    list.append(el("p", "empty", "لا توجد غرف بعد. ستظهر هنا عندما يدخل أحد المستخدمين"));
    return;
  }
  for (const r of items) {
    const name = r.username || "مستخدم";
    const info = el("div", "info");
    info.append(el("div", "name", name), el("div", "last", r.lastText || "لا توجد رسائل بعد"));
    const row = el("button", "item");
    row.type = "button";
    row.append(el("div", "avatar", name.charAt(0).toUpperCase()), info);
    row.onclick = () => openRoom(r.id, name);
    list.append(row);
  }
}

function openRoom(id, title) {
  roomId = id;
  $("chatTitle").textContent = title;
  $("listView").hidden = true;
  $("chatView").hidden = false;
  $("back").hidden = !me.isOwner;
  listenMessages();
}

$("back").onclick = () => {
  unsubMsgs?.();
  roomId = null;
  $("chatView").hidden = true;
  $("listView").hidden = false;
};

/* الرسائل بالوقت الفعلي، آخر 100 رسالة في الغرفة */
function listenMessages() {
  unsubMsgs?.();
  const q = query(
    collection(db, "rooms", roomId, "messages"),
    orderBy("createdAt", "desc"),
    limit(100)
  );
  unsubMsgs = onSnapshot(q,
    snap => {
      const box = $("messages");
      box.textContent = "";
      if (snap.empty) {
        box.append(el("p", "empty", "لا توجد رسائل بعد. اكتب أول رسالة"));
        return;
      }
      [...snap.docs].reverse().forEach(d => {
        const m = d.data();
        box.append(el("div", "bubble " + (m.senderId === me.uid ? "mine" : "theirs"), m.text));
      });
      box.scrollTop = box.scrollHeight;
    },
    err => { $("messages").replaceChildren(el("p", "empty", errText(err))); }
  );
}

$("sendForm").onsubmit = async e => {
  e.preventDefault();
  const input = $("msgInput");
  const text = input.value.trim();
  if (!text || !roomId) return;
  input.value = "";
  try {
    const ref = doc(db, "rooms", roomId);
    await addDoc(collection(ref, "messages"), {
      text, senderId: me.uid, createdAt: serverTimestamp()
    });
    await updateDoc(ref, { lastText: text.slice(0, 80), lastAt: serverTimestamp() });
  } catch (err) {
    input.value = text;
    alert(errText(err));
  }
};
</script>
</body>
</html>
