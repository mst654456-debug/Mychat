<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الشات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #e7e4da;
      --surface: #f8f7f3;
      --ink: #1d2331;
      --muted: #6b7180;
      --brick: #b8462e;
      --line: #cfcabb;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
      font-size: 16px;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    :focus-visible { outline: 2px solid var(--brick); outline-offset: 2px; }

    .app {
      width: 100%;
      max-width: 460px;
      height: 100%;
      max-height: 760px;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      border-inline: 1px solid var(--line);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 2px solid var(--ink);
    }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    .head-right {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 14px;
      color: var(--muted);
    }
    #me { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ghost {
      background: none;
      border: 1px solid var(--ink);
      color: var(--ink);
      border-radius: 4px;
      padding: 4px 12px;
    }

    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    #login {
      justify-content: center;
      gap: 12px;
      padding: 32px 22px;
    }
    #login h2 { margin: 0 0 8px; font-size: 24px; font-weight: 600; }
    #login input {
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
    }
    .primary {
      padding: 12px;
      background: var(--ink);
      color: var(--surface);
      border: none;
      border-radius: 4px;
    }
    .text-btn {
      align-self: center;
      background: none;
      border: none;
      color: var(--brick);
      padding: 6px;
      text-decoration: underline;
    }
    .error { min-height: 22px; color: var(--brick); font-size: 14px; }

    #messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 78%;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      align-self: flex-end;
      overflow-wrap: anywhere;
    }
    .msg.me {
      align-self: flex-start;
      background: var(--ink);
      border-color: var(--ink);
      color: var(--surface);
    }
    .msg .who { font-size: 13px; font-weight: 600; color: var(--brick); }
    .msg.me .who { display: none; }
    .msg .time { margin-top: 4px; font-size: 11px; color: var(--muted); }
    .msg.me .time { color: #a9afbd; }

    form#form {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 2px solid var(--ink);
    }
    form#form input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
    }
    form#form button {
      padding: 0 18px;
      background: var(--brick);
      color: #fff;
      border: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>الشات</h1>
      <div class="head-right">
        <span id="me"></span>
        <button id="logoutBtn" class="ghost" hidden>خروج</button>
      </div>
    </header>

    <section id="login" class="screen">
      <h2 id="authTitle">ادخل على حسابك</h2>
      <input id="username" placeholder="اسم المستخدم (إنجليزي أو أرقام)" autocomplete="username" maxlength="20" />
      <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
      <div class="error" id="error"></div>
      <button class="primary" id="authBtn">دخول</button>
      <button class="text-btn" id="toggleMode">مش عندك حساب؟ سجّل دلوقتي</button>
    </section>

    <section id="chat" class="screen" hidden>
      <div id="messages"></div>
      <form id="form">
        <input id="text" placeholder="اكتب رسالة" autocomplete="off" maxlength="500" />
        <button type="submit">إرسال</button>
      </form>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile,
      signOut,
      onAuthStateChanged,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyBeb4EKVwVuxyBF--V11ehJXrYwm55Ca4Y',
      authDomain: 'mychat-2f14b.firebaseapp.com',
      projectId: 'mychat-2f14b',
      storageBucket: 'mychat-2f14b.firebasestorage.app',
      messagingSenderId: '122687623931',
      appId: '1:122687623931:web:f8fbfa0074701e6388965e',
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = (id) => document.getElementById(id);
    const USERNAME_RE = /^[A-Za-z0-9_]{3,20}$/;
    const WRONG_LOGIN = 'اسم المستخدم أو كلمة المرور غلط';
    const ERRORS = {
      'auth/email-already-in-use': 'الاسم ده محجوز، جرّب اسم تاني',
      'auth/invalid-credential': WRONG_LOGIN,
      'auth/wrong-password': WRONG_LOGIN,
      'auth/user-not-found': WRONG_LOGIN,
      'auth/weak-password': 'كلمة المرور لازم تكون 6 حروف على الأقل',
      'auth/too-many-requests': 'محاولات كتير، استنى شوية وجرّب تاني',
      'auth/network-request-failed': 'مفيش اتصال بالإنترنت',
      'auth/operation-not-allowed': 'لازم تفعّل Email/Password من Firebase الأول',
    };

    let mode = 'login';
    let currentUser = null;
    let unsubscribe = null;

    // المستخدم بيكتب اسم بس، والإيميل بيتعمل من الاسم في الخلفية
    const toEmail = (username) => username.toLowerCase() + '@mychat.app';
    const nameOf = (user) => user.displayName || user.email.split('@')[0];

    function enterChat(user) {
      currentUser = user;
      $('login').hidden = true;
      $('chat').hidden = false;
      $('logoutBtn').hidden = false;
      $('me').textContent = nameOf(user);

      if (unsubscribe) unsubscribe();
      const q = query(
        collection(db, 'messages'),
        orderBy('createdAt', 'desc'),
        limit(100)
      );
      unsubscribe = onSnapshot(q, render, (err) => {
        alert('مش قادر أحمّل الرسايل: ' + err.message);
      });
    }

    function leaveChat() {
      if (unsubscribe) unsubscribe();
      unsubscribe = null;
      currentUser = null;
      $('login').hidden = false;
      $('chat').hidden = true;
      $('logoutBtn').hidden = true;
      $('me').textContent = '';
      $('messages').innerHTML = '';
    }

    onAuthStateChanged(auth, (user) => {
      if (user) enterChat(user);
      else leaveChat();
    });

    async function submitAuth() {
      const username = $('username').value.trim();
      const password = $('password').value;
      $('error').textContent = '';

      if (!USERNAME_RE.test(username)) {
        $('error').textContent = 'اسم المستخدم لازم يكون من 3 لـ 20 حرف إنجليزي أو أرقام أو _';
        return;
      }
      if (password.length < 6) {
        $('error').textContent = 'كلمة المرور لازم تكون 6 حروف على الأقل';
        return;
      }

      $('authBtn').disabled = true;
      try {
        const email = toEmail(username);
        if (mode === 'register') {
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          await updateProfile(cred.user, { displayName: username });
          enterChat(auth.currentUser);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        $('password').value = '';
      } catch (err) {
        $('error').textContent = ERRORS[err.code] || 'حصلت مشكلة: ' + err.code;
      } finally {
        $('authBtn').disabled = false;
      }
    }

    $('authBtn').onclick = submitAuth;
    $('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitAuth();
    });

    $('toggleMode').onclick = () => {
      mode = mode === 'login' ? 'register' : 'login';
      const isLogin = mode === 'login';
      $('authTitle').textContent = isLogin ? 'ادخل على حسابك' : 'اعمل حساب جديد';
      $('authBtn').textContent = isLogin ? 'دخول' : 'تسجيل';
      $('toggleMode').textContent = isLogin
        ? 'مش عندك حساب؟ سجّل دلوقتي'
        : 'عندك حساب؟ ادخل من هنا';
      $('error').textContent = '';
    };

    $('logoutBtn').onclick = () => signOut(auth);

    function render(snap) {
      const box = $('messages');
      box.innerHTML = '';

      for (const d of snap.docs.slice().reverse()) {
        const m = d.data();
        const el = document.createElement('div');
        el.className = 'msg' + (currentUser && m.uid === currentUser.uid ? ' me' : '');

        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = m.name;

        const text = document.createElement('div');
        text.textContent = m.text;

        const time = document.createElement('div');
        time.className = 'time';
        const date = m.createdAt ? m.createdAt.toDate() : new Date();
        time.textContent = date.toLocaleTimeString('ar-EG', {
          hour: '2-digit',
          minute: '2-digit',
        });

        el.append(who, text, time);
        box.appendChild(el);
      }
      box.scrollTop = box.scrollHeight;
    }

    $('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = $('text');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = '';
      try {
        await addDoc(collection(db, 'messages'), {
          text: text.slice(0, 500),
          uid: currentUser.uid,
          name: nameOf(currentUser),
          createdAt: serverTimestamp(),
        });
      } catch (err) {
        input.value = text;
        alert('الرسالة متبعتتش: ' + err.message);
      }
    };
  </script>
</body>
</html>
